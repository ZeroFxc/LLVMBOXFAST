name: Build LLVMBOX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version to build'
        required: true
        default: '22.1.0'
        type: string

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version || '22.1.0' }}
  # Use MinSizeRel for much lower memory/disk usage during linking
  BUILD_JOBS: 2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "2G"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment diagnostics
        run: |
          echo "=== Disk ===" && df -h / && echo ""
          echo "=== Memory ===" && free -h && echo ""
          echo "=== CPU ===" && nproc && echo ""
          echo "=== Temp space ===" && df -h /tmp && echo ""

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build ccache python3 \
            ca-certificates curl xz-utils zlib1g-dev
          ccache --version

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-x86_64-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-x86_64-llvm-${{ env.LLMVMBOX_VERSION }}-
            ccache-${{ runner.os }}-x86_64-llvm-

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          echo ""
          # Remove unnecessary large packages
          sudo apt-get remove -y --purge \
            azure-cli dotnet-* ghc-* firefox google-chrome-stable \
            mysql-server* php-* mono-* ruby-* 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /usr/local/lib/heroku 2>/dev/null || true
          sudo rm -rf /usr/share/swift 2>/dev/null || true
          echo ""
          echo "After cleanup:"
          df -h /

      - name: Download LLVM source
        run: |
          echo "Downloading LLVM ${{ env.LLVM_VERSION }}..."
          V="${{ env.LLVM_VERSION }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          if [ "$MAJOR" -ge 16 ]; then
            SRC_FILE="llvm-project-${V}.src.tar.xz"
            SRC_DIR="llvm-project-${V}.src"
            TAR_OPT="xJ"
          else
            SRC_FILE="llvm-project-llvmorg-${V}.tar.gz"
            SRC_DIR="llvm-project-llvmorg-${V}"
            TAR_OPT="xz"
          fi
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${V}/${SRC_FILE}"
          echo "URL: $URL"
          curl -L --retry 3 --retry-delay 5 -o llvm.src.tar "$URL"
          ls -lh llvm.src.tar
          tar ${TAR_OPT}f llvm.src.tar
          mv "$SRC_DIR" llvm-source
          du -sh llvm-source

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=${{ env.CCACHE_MAXSIZE }}
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime
          ccache -z

      - name: Configure LLVM (CMake)
        run: |
          mkdir -p build && cd build
          cmake -G Ninja ../llvm-source/llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;WebAssembly" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_ENABLE_PIC=OFF \
            -DLLVM_ENABLE_MODULES=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_EH=OFF \
            -DLLVM_ENABLE_RTTI=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            \
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ \
            -DCLANG_DEFAULT_RTLIB=compiler-rt \
            -DCLANG_DEFAULT_UNWINDLIB=libunwind \
            -DCLANG_DEFAULT_LINKER=lld \
            -DCLANG_DEFAULT_OBJCOPY=llvm-objcopy \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_VENDOR=llvmbox \
            \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXX_CXX_ABI=libcxxabi \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC_UNWINDER=ON \
            -DLIBUNWIND_ENABLE_SHARED=OFF \
            \
            -DCOMPILER_RT_BUILD_CRT=ON \
            -DCOMPILER_RT_INCLUDE_TESTS=OFF \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
            -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DCOMPILER_RT_BUILD_GWP_ASAN=OFF \
            -DCOMPILER_RT_USE_BUILTINS_LIBRARY=ON

      - name: Build LLVM
        run: |
          cd build
          echo "Starting build with -j${{ env.BUILD_JOBS }} ..."
          echo "Build started at: $(date)"
          # Monitor memory during build
          (while true; do free -h | tail -1 >> /tmp/mem.log; sleep 30; done) &
          MEMPID=$!
          time ninja -j${{ env.BUILD_JOBS }} 2>&1 | tee /tmp/build.log
          kill $MEMPID 2>/dev/null
          echo "Build finished at: $(date)"
          echo "=== Memory usage during build ==="
          sort -t' ' -k4 -h /tmp/mem.log | tail -1
          echo ""
          echo "=== ccache stats ==="
          ccache -s
          echo ""
          echo "=== Disk after build ==="
          df -h /

      - name: Install & Strip
        run: |
          cd build
          ninja install/stripping 2>/dev/null || ninja install
          find ${{ github.workspace }}/install/bin -type f -executable -exec strip --strip-all {} + 2>/dev/null || true
          find ${{ github.workspace }}/install/lib -name "*.a" -exec strip --strip-debug {} + 2>/dev/null || true
          echo "=== Install size ==="
          du -sh ${{ github.workspace }}/install

      - name: Package
        run: |
          cd ${{ github.workspace }}
          VERSION="${{ env.LLVM_VERSION }}"
          PKG_NAME="llvmbox-${VERSION}-x86_64-linux"
          mkdir -p "${PKG_NAME}"
          cp -a install/* "${PKG_NAME}/"
          tar --use-compress-program='xz -T0 -9' -cf "${PKG_NAME}.tar.xz" "${PKG_NAME}"
          ls -lh "${PKG_NAME}.tar.xz"
          sha256sum "${PKG_NAME}.tar.xz" | tee "${PKG_NAME}.tar.xz.sha256"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.LLVM_VERSION }}
          path: |
            /tmp/build.log
            /tmp/mem.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llvmbox-${{ env.LLVM_VERSION }}-x86_64-linux
          path: llvmbox-*.tar.xz*
          retention-days: 30

      - name: ccache post stats
        if: always()
        run: ccache -s

  release:
    name: Create Release
    needs: build-linux-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/**/*
          body: |
            LLVMBOX ${{ github.ref_name }}
            LLVM ${{ env.LLVM_VERSION }} for Linux x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

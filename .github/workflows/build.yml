name: Build llvmbox

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version'
        required: true
        default: '22.1.0'
        type: string

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version || '22.1.0' }}
  BUILD_JOBS: 2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "2G"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo apt-get remove -y --purge azure-cli dotnet-* firefox google-chrome-stable 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build ccache curl xz-utils \
            python3 ca-certificates
          ccache --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-x86_64-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml', 'patches/*.patch') }}
          restore-keys: |
            ccache-${{ runner.os }}-x86_64-llvm-${{ env.LLMVMBOX_VERSION }}-
            ccache-${{ runner.os }}-x86_64-llvm-

      - name: Setup ccache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=${{ env.CCACHE_MAXSIZE }}
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime
          ccache -z -p

      - name: Download LLVM
        run: |
          V="${{ env.LLVM_VERSION }}"
          SRC_FILE="llvm-project-${V}.src.tar.xz"
          SRC_DIR="llvm-project-${V}.src"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${V}/${SRC_FILE}"
          echo "Downloading: $URL"
          curl -L --retry 3 --retry-delay 5 -o llvm.tar.xz "$URL"
          tar xJf llvm.tar.xz
          mv "$SRC_DIR" llvm-source
          echo "=== Source ready ==="
          du -sh llvm-source

      - name: Apply patches
        run: |
          cd llvm-source
          PATCH_DIR="${{ github.workspace }}/patches"
          V="${{ env.LLVM_VERSION }}"
          for f in "$PATCH_DIR"/*-${V}-*.patch; do
            [ -f "$f" ] || continue
            echo "Applying: $(basename $f)"
            patch -p1 < "$f" || { echo "FAILED"; exit 1; }
          done
          echo "All patches applied."

      - name: Configure
        run: |
          mkdir -p build && cd build

          cmake -G Ninja ../llvm-source/llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;RISCV;WebAssembly" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_ENABLE_PIC=OFF \
            -DLLVM_ENABLE_MODULES=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_EH=OFF \
            -DLLVM_ENABLE_RTTI=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_UTILS=ON \
            \
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ \
            -DCLANG_DEFAULT_RTLIB=compiler-rt \
            -DCLANG_DEFAULT_UNWINDLIB=libunwind \
            -DCLANG_DEFAULT_LINKER=lld \
            -DCLANG_DEFAULT_OBJCOPY=llvm-objcopy \
            -DCLANG_VENDOR=llvmbox \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXX_CXX_ABI=libcxxabi \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC_UNWINDER=ON \
            -DLIBUNWIND_ENABLE_SHARED=OFF \
            \
            -DCOMPILER_RT_BUILD_CRT=ON \
            -DCOMPILER_RT_INCLUDE_TESTS=OFF \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
            -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DCOMPILER_RT_BUILD_PROFILE=OFF \
            -DCOMPILER_RT_USE_BUILTINS_LIBRARY=ON

      - name: Build
        run: |
          cd build
          echo "Build start: $(date)"
          time ninja -j${{ env.BUILD_JOBS }} 2>&1 | tee /tmp/build.log
          echo "Build end: $(date)"
          ccache -s

      - name: Install & Strip
        run: |
          cd build
          ninja install/strip 2>/dev/null || ninja install
          find ${{ github.workspace }}/install/bin -type f -executable -exec strip --strip-all {} + 2>/dev/null || true
          find ${{ github.workspace }}/install/lib -name "*.a" -exec strip --strip-debug {} + 2>/dev/null || true
          du -sh ${{ github.workspace }}/install
          echo "=== Built .a libs ==="
          ls install/lib/*.a 2>/dev/null | wc -l

      - name: Build single-binary llvmbox
        run: |
          INSTALL=${{ github.workspace }}/install

          # ── 1. Compile the unified entry-point ──────────────────────────
          #     llvmbox.cpp dispatches to clang_main or lld_main based on
          #     argv[0] basename (just like busybox).
          "$INSTALL/bin/clang++" -std=c++17 -DNDEBUG \
            -I${{ github.workspace }}/include \
            -I${{ github.workspace }}/llvm-source/clang/include \
            -I${{ github.workspace }}/llvm-source/lld/include \
            -I${{ github.workspace }}/llvm-source/llvm/include \
            -I${{ github.workspace }}/build/include \
            -I${{ github.workspace }}/build/tools/clang/include \
            -I${{ github.workspace }}/build/tools/lld/include \
            -c ${{ github.workspace }}/src/entry/llvmbox.cpp \
            -o /tmp/llvmbox_main.o

          # ── 2. Collect all static .a libraries ─────────────────────────
          #     We need all of LLVM + clang + lld in one binary.
          LIBS=$(find "$INSTALL/lib" -name '*.a' | sort | tr '\n' ' ')

          # ── 3. Driver .o files for the clang tool entry ────────────────
          #     We take all clang .o files EXCEPT clang-driver.cpp.o (which
          #     has its own `main` from the llvm-driver template — we replace
          #     it with our unified main).
          DRV_O=$(find "${{ github.workspace }}/build/tools/clang/tools/driver/CMakeFiles/clang.dir" \
                    -name '*.o' ! -name 'clang-driver.cpp.o' | sort | tr '\n' ' ')

          # ── 4. Link into one executable ────────────────────────────────
          #     We link LLVM/clang/lld statically but leave libstdc++ and
          #     system libs dynamic (same strategy as the upstream clang
          #     toolchain driver binary). We use the system's clang++ from
          #     /usr/lib/llvm-22 (or fallback to /usr/bin/clang++) so that
          #     libstdc++ search paths are set up correctly; the just-built
          #     clang++ from source does not carry these paths.
          SYS_CLANGXX=$(command -v clang++ || true)
          if [ -x "/usr/lib/llvm-22/bin/clang++" ]; then
            SYS_CLANGXX="/usr/lib/llvm-22/bin/clang++"
          elif [ -x "/usr/bin/clang++" ]; then
            SYS_CLANGXX="/usr/bin/clang++"
          fi
          echo "Using SYS_CLANGXX=$SYS_CLANGXX"
          "$SYS_CLANGXX" -stdlib=libstdc++ \
            /tmp/llvmbox_main.o \
            $DRV_O \
            $LIBS \
            -lpthread -ldl -lz -lrt -latomic -lstdc++ -lm \
            -o "$INSTALL/bin/llvmbox"

          # ── 5. Strip ───────────────────────────────────────────────────
          strip --strip-all "$INSTALL/bin/llvmbox"
          ls -lh "$INSTALL/bin/llvmbox"
          file  "$INSTALL/bin/llvmbox"

          # ── 6. Create symlinks so the unified binary also answers to ──
          #     lld / ld.lld / ld64.lld / lld-link / wasm-ld
          cd "$INSTALL/bin"
          for name in lld ld.lld ld64.lld lld-link wasm-ld; do
            ln -sf llvmbox "$name"
          done

      - name: Smoke test
        run: |
          INSTALL=${{ github.workspace }}/install
          echo "=== llvmbox --version ===" && "$INSTALL/bin/llvmbox" --version
          echo "=== pack ./llvmbox ===" && echo 'int main(){return 0;}' > /tmp/t.c && "$INSTALL/bin/llvmbox" -o /tmp/t /tmp/t.c && /tmp/t && echo OK

      - name: Package
        run: |
          V="${{ env.LLVM_VERSION }}"
          PKG="llvmbox-${V}-x86_64-linux"
          mkdir -p "$PKG"
          cp -a install/* "$PKG/"
          tar --use-compress-program='xz -T0 -9' -cf "${PKG}.tar.xz" "$PKG"
          sha256sum "${PKG}.tar.xz" | tee "${PKG}.tar.xz.sha256"
          ls -lh "${PKG}.tar.xz"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.LLVM_VERSION }}
          path: /tmp/build.log

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llvmbox-${{ env.LLVM_VERSION }}-x86_64-linux
          path: llvmbox-*.tar.xz*
          retention-days: 30

      - name: ccache post stats
        if: always()
        run: ccache -s

  # ──────────────────────────────────────────────────────────────
  # Android ARM64 — single binary that runs on Android
  # ──────────────────────────────────────────────────────────────
  build-android-arm64:
    name: Build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get remove -y --purge dotnet-* firefox google-chrome-stable 2>/dev/null || true
          sudo apt-get autoremove -y 2>/dev/null || true
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          # ninja + ca-certificates for NDK download
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build ca-certificates curl xz-utils unzip
          # Install JDK for JNI header generation (optional at build time)
          sudo apt-get install -y -qq --no-install-recommends default-jdk

      - name: Download Android NDK
        run: |
          # NDK r27 — has clang-18, lld, sysroot for android-{21,24,26,...}
          curl -L --retry 3 -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          unzip -q ndk.zip -d ${{ github.workspace }}
          NDK=${{ github.workspace }}/android-ndk-r27
          echo "NDK=$NDK" >> $GITHUB_ENV
          echo "TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          ls "$TC/bin/" | head -10

      - name: Reuse Linux build cache
        uses: actions/cache@v4
        with:
          path: build
          key: llvm-build-android-arm64-${{ env.LLVM_VERSION }}-${{ hashFiles('llvm-source/**') }}
          restore-keys: |
            llvm-build-android-arm64-${{ env.LLVM_VERSION }}-

      - name: Configure for Android
        run: |
          NDK=${{ env.NDK }}
          TC=${{ env.TC }}

          mkdir -p build-android && cd build-android

          # Copy linux-source from workspace if not cached
          if [ ! -d llvm-source ]; then
            cp -r ${{ github.workspace }}/llvm-source . 2>/dev/null || true
          fi
          if [ ! -d llvm-source ]; then
            # Fresh download
            V="${{ env.LLVM_VERSION }}"
            curl -L --retry 3 -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${V}/llvm-project-${V}.src.tar.xz"
            tar xJf llvm.tar.xz && mv "llvm-project-${V}.src" llvm-source
            cd llvm-source && patch -p1 < ${{ github.workspace }}/patches/clang-${V}-add-musl-triples.patch 2>/dev/null || true
            cd ..
          fi

          cmake -G Ninja llvm-source/llvm \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install-android \
            \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$NDK \
            -DCMAKE_ANDROID_STL_TYPE=c++_static \
            \
            -DCMAKE_C_COMPILER=$TC/bin/clang \
            -DCMAKE_CXX_COMPILER=$TC/bin/clang++ \
            -DCMAKE_C_COMPILER_TARGET=aarch64-none-linux-android24 \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-none-linux-android24 \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
            -DLLVM_ENABLE_PROJECTS="clang;lld;clang-tools-extra" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_ENABLE_PIC=ON \
            -DLLVM_ENABLE_MODULES=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_EH=OFF \
            -DLLVM_ENABLE_RTTI=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_UTILS=ON \
            \
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ \
            -DCLANG_DEFAULT_RTLIB=compiler-rt \
            -DCLANG_DEFAULT_UNWINDLIB=libunwind \
            -DCLANG_DEFAULT_LINKER=lld \
            -DCLANG_DEFAULT_OBJCOPY=llvm-objcopy \
            -DCLANG_DEFAULT_TARGET_TRIPLE=aarch64-linux-android24 \
            -DCLANG_VENDOR=llvmbox \
            \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXX_CXX_ABI=libcxxabi \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC_UNWINDER=ON \
            -DLIBUNWIND_ENABLE_SHARED=OFF \
            \
            -DCOMPILER_RT_BUILD_CRT=ON \
            -DCOMPILER_RT_INCLUDE_TESTS=OFF \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
            -DCOMPILER_RT_USE_BUILTINS_LIBRARY=ON \
            -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON

      - name: Build Android ARM64
        run: |
          cd build-android
          echo "Build start: $(date)"
          time ninja -j${{ env.BUILD_JOBS }} 2>&1 | tee /tmp/android-build.log
          echo "Build end: $(date)"

      - name: Install & Strip (Android)
        run: |
          cd build-android
          ninja install/strip 2>/dev/null || ninja install
          INSTALL=${{ github.workspace }}/install-android

          # Strip native Android binaries
          find $INSTALL/bin -type f -exec $TC/bin/llvm-strip --strip-all {} + 2>/dev/null || true
          find $INSTALL/lib -name "*.a" -exec $TC/bin/llvm-strip --strip-debug {} + 2>/dev/null || true

          echo "=== Install size ==="
          du -sh $INSTALL

          # Copy llvmbox binary (rename from clang for clarity, since we patched vendor=llvmbox)
          mkdir -p $INSTALL/bin-aliases
          if [ -f "$INSTALL/bin/clang" ]; then
            cp -l $INSTALL/bin/clang $INSTALL/bin-aliases/llvmbox 2>/dev/null || cp $INSTALL/bin/clang $INSTALL/bin-aliases/llvmbox
          fi

      - name: Test Android binary (in emulator)
        run: |
          INSTALL=${{ github.workspace }}/install-android
          BIN=$INSTALL/bin/clang  # or $INSTALL/bin-aliases/llvmbox
          echo "=== file type ==="
          file $BIN
          echo "=== readelf header ==="
          ${{ env.TC }}/bin/llvm-readelf -h $BIN | grep -E "Class|Machine|Type" || true
          echo "=== ldd ==="
          ldd $BIN 2>&1 || true

      - name: Package Android
        run: |
          V="${{ env.LLVM_VERSION }}"
          PKG="llvmbox-${V}-android-arm64"
          mkdir -p "$PKG"
          cp -a install-android/* "$PKG/"

          # Put llvmbox.h header at the root for easy inclusion
          mkdir -p "$PKG/include"
          cp ${{ github.workspace }}/include/llvmbox.h "$PKG/include/" 2>/dev/null || true

          tar --use-compress-program='xz -T0 -9' -cf "${PKG}.tar.xz" "$PKG"
          sha256sum "${PKG}.tar.xz" | tee "${PKG}.tar.xz.sha256"
          ls -lh "${PKG}.tar.xz"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvmbox-${{ env.LLVM_VERSION }}-android-arm64
          path: llvmbox-*android*.tar.xz*
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux-x86_64, build-android-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: llvmbox-*
      - run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/**
          body: |
            llvmbox ${{ github.ref_name }} — LLVM ${{ env.LLVM_VERSION }} for Linux x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

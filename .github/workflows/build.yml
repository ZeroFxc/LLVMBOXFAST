name: Build LLVMBOX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM version to build'
        required: true
        default: '22.1.0'
        type: string

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version || '22.1.0' }}
  # Limit parallelism to avoid OOM on GitHub Actions runners (2 CPU, 7GB RAM)
  BUILD_JOBS: 2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "4G"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 360  # 6 hours max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            python3 \
            ca-certificates \
            curl \
            xz-utils \
            zlib1g-dev
          ccache --version

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-x86_64-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ccache-linux-x86_64-llvm-${{ env.LLVM_VERSION }}-
            ccache-linux-x86_64-llvm-

      - name: Download LLVM source
        run: |
          echo "Downloading LLVM ${{ env.LLVM_VERSION }}..."
          # LLVM >= 16.0 uses "llvm-project-VERSION.src.tar.xz" naming
          # LLVM < 16.0 uses "llvm-project-llvmorg-VERSION.tar.gz" naming
          V="${{ env.LLVM_VERSION }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          if [ "$MAJOR" -ge 16 ]; then
            SRC_FILE="llvm-project-${V}.src.tar.xz"
            SRC_DIR="llvm-project-${V}.src"
            TAR_OPT="xJ"
          else
            SRC_FILE="llvmorg-${V}.tar.gz"
            SRC_DIR="llvm-project-llvmorg-${V}"
            TAR_OPT="xz"
          fi
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${V}/${SRC_FILE}"
          echo "URL: $URL"
          curl -L --retry 3 --retry-delay 5 -o llvm.src.tar "$URL"
          ls -lh llvm.src.tar
          tar ${TAR_OPT}f llvm.src.tar
          mv "$SRC_DIR" llvm-source
          du -sh llvm-source

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
          ccache --set-config=max_size=${{ env.CCACHE_MAXSIZE }}
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime
          ccache -z  # zero stats
          ccache -p  # print config

      - name: Configure LLVM (CMake)
        run: |
          mkdir -p build && cd build

          # Use ccache as compiler wrapper
          export CC="ccache gcc"
          export CXX="ccache g++"

          cmake -G Ninja ../llvm-source/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;RISCV;WebAssembly" \
            -DLLVM_ENABLE_PROJECTS="clang;lld;clang-tools-extra" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind;compiler-rt" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_BUILD_LLVM_C_DYLIB=OFF \
            -DLLVM_ENABLE_PIC=OFF \
            -DLLVM_ENABLE_MODULES=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_EH=OFF \
            -DLLVM_ENABLE_RTTI=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_BACKTRACES=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            \
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ \
            -DCLANG_DEFAULT_RTLIB=compiler-rt \
            -DCLANG_DEFAULT_UNWINDLIB=libunwind \
            -DCLANG_DEFAULT_LINKER=lld \
            -DCLANG_DEFAULT_OBJCOPY=llvm-objcopy \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_PLUGIN_SUPPORT=OFF \
            -DCLANG_VENDOR=llvmbox \
            \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXX_CXX_ABI=libcxxabi \
            -DLIBCXX_USE_COMPILER_RT=ON \
            -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXX_INCLUDE_BENCHMARKS=OFF \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC_UNWINDER=ON \
            -DLIBCXXABI_INCLUDE_TESTS=OFF \
            -DLIBUNWIND_ENABLE_SHARED=OFF \
            \
            -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
            -DCOMPILER_RT_BUILD_GWP_ASAN=OFF \
            -DCOMPILER_RT_BUILD_CRT=ON \
            -DCOMPILER_RT_INCLUDE_TESTS=OFF \
            -DCOMPILER_RT_USE_BUILTINS_LIBRARY=ON

      - name: Build LLVM
        run: |
          cd build
          echo "Starting build with -j${{ env.BUILD_JOBS }} ..."
          time ninja -j${{ env.BUILD_JOBS }} 2>&1
          echo ""
          echo "Build complete. ccache stats:"
          ccache -s

      - name: Install & Strip
        run: |
          cd build
          ninja install/stripping 2>/dev/null || ninja install

          # Show install size
          echo "=== Install size ==="
          du -sh ${{ github.workspace }}/install

          # Strip binaries to reduce size
          find ${{ github.workspace }}/install/bin -type f -executable -exec strip --strip-all {} + 2>/dev/null || true
          find ${{ github.workspace }}/install/lib -name "*.a" -exec strip --strip-debug {} + 2>/dev/null || true

          echo "=== After stripping ==="
          du -sh ${{ github.workspace }}/install

      - name: Package
        run: |
          cd ${{ github.workspace }}
          VERSION="${{ env.LLVM_VERSION }}"
          PKG_NAME="llvmbox-${VERSION}-x86_64-linux"

          mkdir -p "${PKG_NAME}"
          cp -a install/* "${PKG_NAME}/"

          # Create tarball
          tar cfJ "${PKG_NAME}.tar.xz" "${PKG_NAME}"

          # Show result
          ls -lh "${PKG_NAME}.tar.xz"
          echo "Package: ${PKG_NAME}.tar.xz"
          echo "Size: $(du -h "${PKG_NAME}.tar.xz" | cut -f1)"

          # Create checksum
          sha256sum "${PKG_NAME}.tar.xz" > "${PKG_NAME}.tar.xz.sha256"
          cat "${PKG_NAME}.tar.xz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvmbox-${{ env.LLVM_VERSION }}-x86_64-linux
          path: llvmbox-*.tar.xz*
          retention-days: 30

      - name: ccache post stats
        if: always()
        run: ccache -s

  # ─────────────────────────────────────────────────────────
  # Create Release when pushed a tag
  # ─────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build-linux-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LLVMBOX ${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: artifacts/**/*
          body: |
            LLVMBOX ${{ github.ref_name }}
            Built with LLVM ${{ env.LLVM_VERSION }} for Linux x86_64

            ## Usage
            ```sh
            tar xf llvmbox-*.tar.xz
            ./llvmbox-*/bin/clang --version
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
